name: Update g

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-g
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Fetch latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..5}; do
            if gh api "repos/frankittee/Git-Config-Manager/releases/latest" > release.json.tmp; then
              mv release.json.tmp release.json
              exit 0
            fi

            sleep "$((attempt * 5))"
          done

          exit 1

      - name: Update Formula
        run: python3 scripts/update-g.py release.json

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "g is current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/git-config-manager.rb
          git commit -m "Update g to latest release"
          git push
